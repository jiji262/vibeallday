// Side-by-side device qualification. Never use this identity for publication.
allprojects {
  plugins.withId('com.android.application') {
    androidComponents.finalizeDsl { extension ->
      def testId = rootProject.findProperty('vibeAllDayTestApplicationId') ?: 'com.vibeallday.mobile.transporttest'
      if (!(testId in ['com.vibeallday.mobile.transporttest', 'com.vibeallday.mobile.artifacttest'])) {
        throw new GradleException('Only owned test application IDs are allowed')
      }
      extension.defaultConfig.applicationId = testId
      extension.sourceSets.getByName('debug').manifest.srcFile(
        new File(rootProject.projectDir, 'scripts/isolated-test-manifest.xml'))
    }
  }
}
