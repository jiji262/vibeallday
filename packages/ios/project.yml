name: VibeAllDay
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.19.2
settings:
  base:
    ARCHS: "$(ARCHS_STANDARD)"
    "VIBEALLDAY_RUST_SIM_TARGET[arch=arm64]": aarch64-apple-ios-sim
    "VIBEALLDAY_RUST_SIM_TARGET[arch=x86_64]": x86_64-apple-ios
    HEADER_SEARCH_PATHS: "$(SRCROOT)/Generated"
    OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -fmodule-map-file=$(SRCROOT)/Generated/vibeallday_mobile_coreFFI.modulemap"
    SWIFT_VERSION: "5.10"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production
targets:
  VibeAllDay:
    type: application
    platform: iOS
    sources:
      - path: Generated/vibeallday_mobile_core.swift
      - path: App
      - path: build/web
        type: folder
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibeallday.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "OTHER_LDFLAGS[sdk=iphoneos*]": '$(inherited) "$(SRCROOT)/../mobile-core/target/aarch64-apple-ios/release/libvibeallday_mobile_core.a" -framework Security'
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": '$(inherited) "$(SRCROOT)/../mobile-core/target/$(VIBEALLDAY_RUST_SIM_TARGET)/release/libvibeallday_mobile_core.a" -framework Security'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
  VibeAllDayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: build/fixture.json
        buildPhase: resources
    dependencies:
      - target: VibeAllDay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibeallday.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  VibeAllDayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      - path: build/fixture.json
        buildPhase: resources
    dependencies:
      - target: VibeAllDay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibeallday.ios.ui-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VibeAllDay
schemes:
  VibeAllDay:
    build:
      targets:
        VibeAllDay: all
    test:
      targets: [VibeAllDayTests, VibeAllDayUITests]
      preferredScreenCaptureFormat: screenshots
      captureScreenshotsAutomatically: false
