<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover" />
    <title>VibeAllDay - Remote</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <meta name="theme-color" content="#fbf8f2" />
    <style>
      /* Critical CSS to prevent flash of white background - only html, body/root handled by main CSS */
      html { background-color: #fbf8f2; }
      html[data-theme="dark"] { background-color: #14131a; }
      html[data-theme="verydark"] { background-color: #0b0a0f; }
      html, body, #root { min-height: 100%; min-height: 100dvh; }
      body { margin: 0; background-color: inherit; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) { background-color: #14131a; }
        html[data-theme="auto"] { background-color: #14131a; }
      }
    </style>
    <script>
      // Apply theme before page renders to prevent flash
      (() => {
        var stored = localStorage.getItem('vibeallday-theme');
        var theme = stored || 'auto';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/remote-main.tsx"></script>
  </body>
</html>
